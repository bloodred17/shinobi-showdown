[workspace]
members = [
  "crates/game-client",
  "crates/game-content",
  "crates/game-domain",
  "crates/game-protocol",
  "crates/game-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
