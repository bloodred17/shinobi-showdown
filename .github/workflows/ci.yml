name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: 'npm'

      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: npm ci
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm exec playwright install --with-deps chromium
      - run: npm exec nx format:check --base="remotes/origin/main"
      - run: cargo fmt --all -- --check
      - run: npm exec nx run-many -t lint test build typecheck
      - run: npm exec nx run game-protocol:check-generated
      - run: npm exec nx run web-e2e:e2e
