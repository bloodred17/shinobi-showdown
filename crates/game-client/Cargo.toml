[package]
name = "shinobi-game-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = [
  "2d_bevy_render",
  "bevy_winit",
  "default_app",
  "std",
  "web",
  "webgl2",
  "x11",
] }
serde-wasm-bindgen = "0.6"
shinobi-game-domain = { path = "../game-domain" }
shinobi-game-protocol = { path = "../game-protocol" }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["CustomEvent", "CustomEventInit", "EventTarget", "Window"] }
